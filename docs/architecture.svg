<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1515" viewBox="0 0 1120 1515" role="img" aria-labelledby="title desc">
<title id="title">ServicePortal · arquitectura, frontend y datos</title>
<desc id="desc">Tres vistas del portal: navegador React, API y worker en ASP.NET Core con SQLite; regiones de App y cliente HTTP; esquema de solicitudes y recibos vinculados por referencia externa.</desc>
